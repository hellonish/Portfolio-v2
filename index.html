<!DOCTYPE html>
<html lang="en" data-theme="nord-terminal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nishant Sharma — AI Engineer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
  html {
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    height: 100vh;
    overflow-y: scroll;
  }
  body { margin: 0; background: var(--night-800); height: 100vh; overflow: hidden; }
  #app { background: var(--night-900); height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
  .snap-section { height: 100vh; width: 100%; scroll-snap-align: start; overflow: hidden; position: relative; }
  
  /* Force custom scrollbars globally to bypass MacOS hiding and browser caching */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
    -webkit-appearance: none;
  }
  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 4px;
    margin: 4px 0;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.3);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: rgba(255, 255, 255, 0.6);
  }
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.3) rgba(255, 255, 255, 0.02);
  }

  @media (max-width: 860px) {
    #about [style*="grid-template-columns"], #skills [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
  <div id="root">
    <div id="boot" style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:var(--night-800); z-index:9999;">
      <span style="width:11px; height:11px; border-radius:50%; background:var(--teal-400); box-shadow:0 0 16px var(--teal-400); animation:bootpulse 1.4s infinite;"></span>
      <span id="boot-msg" style="font-family:var(--font-mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--night-muted);">Compiling the system…</span>
    </div>
  </div>
  <style>@keyframes bootpulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.35;transform:scale(.7);} }</style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>
  <script src="_ds_bundle.js"></script>

  <script type="text/babel" src="ui_kits/portfolio/Cursor.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/CustomSelect.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Nav.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Hero.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/About.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Work.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Research.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Skills.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Github.jsx"></script>
  <script type="text/babel" src="ui_kits/portfolio/Contact.jsx"></script>

  <script type="text/babel">
    const { CustomCursor, PortfolioNav, PortfolioHero, PortfolioAbout, PortfolioWork, PortfolioResearch, PortfolioSkills, PortfolioGithub, PortfolioContact } = window;

    function App() {
      const [active, setActive] = React.useState('top');
      const appRef = React.useRef(null);

      const nav = (id) => {
        const elContainer = document.getElementById('app');
        if (id === 'top') { elContainer.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      React.useEffect(() => {
        const elContainer = document.getElementById('app');
        const ids = ['about', 'projects', 'work', 'research', 'skills', 'contact'];
        const onScroll = () => {
          if (!elContainer) return;
          const mid = elContainer.scrollTop + window.innerHeight * 0.35;
          let cur = 'top';
          for (const id of ids) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= mid) cur = id;
          }
          setActive(cur);
        };
        if (elContainer) elContainer.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => {
            if (elContainer) elContainer.removeEventListener('scroll', onScroll);
        };
      }, []);

      return (
        <div id="app" ref={appRef}>
          <CustomCursor />
          <PortfolioNav onNav={nav} active={active} />
          <PortfolioHero onNav={nav} />
          <PortfolioAbout />
          <PortfolioWork />
          <PortfolioResearch />
          <PortfolioSkills />
          <PortfolioGithub />
          <PortfolioContact />
        </div>
      );
    }

    const NS = 'NishantSharmaPortfolioDesignSystem_acfe10';
    let tries = 0, reinjected = false;
    (function boot() {
      const ready = window[NS] && window[NS].ParticleField && window.PortfolioHero && window.PortfolioGithub;
      if (ready) {
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        return;
      }
      tries++;
      if (tries === 10 && !reinjected) {
        reinjected = true;
        const s = document.createElement('script');
        s.src = '_ds_bundle.js';
        s.onload = boot;
        document.body.appendChild(s);
      }
      if (tries < 120) {
        setTimeout(boot, 150);
      } else {
        const m = document.getElementById('boot-msg');
        if (m) m.textContent = 'Could not load _ds_bundle.js — reload in a moment.';
      }
    })();
  </script>

  <!-- CRT Monitor Overlay -->
  <div class="crt-overlay">
    <div class="crt-sweep"></div>
  </div>
</body>
</html>
