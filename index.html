<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nishant Sharma is a backend and infrastructure engineer building AI agents and pursuing independent AI alignment research."
    />
    <title>Nishant Sharma — Engineer &amp; Researcher</title>
    <script>
      // GitHub Pages serves public/404.html for unknown paths. Restore the intended
      // client-side route before Vue Router reads the current location.
      (() => {
        const fallbackPath = new URL(window.location.href).searchParams.get('path')

        if (fallbackPath?.startsWith('/') && !fallbackPath.startsWith('//')) {
          window.history.replaceState(null, '', fallbackPath)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
